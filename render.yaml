services:
  - type: web
    name: plum-market
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      # The demo store (Plum Bakery, its administrator and its customer) is created whenever it is missing from
      # the database, so every deploy has something to present. Set to false for a blank installation.
      - key: Demo__Enabled
        value: "true"
      # The container runs in UTC by default, so "Сегодня" on the dashboard would be a UTC day and the seeded
      # orders would look five hours behind Tashkent.
      - key: TZ
        value: Asia/Tashkent
      # AI helpers in the catalog forms. The key itself is set in the Render dashboard and never in this file:
      # sync: false means "this service needs the variable, ask for its value there".
      - key: OpenAI__ApiKey
        sync: false
      # Free instances have no disk: the filesystem is wiped on each deploy, so the demo store is simply seeded
      # again (with dates relative to the deploy). To keep what people do during a demo, move to a paid instance,
      # add the disk below and point the database at it:
      #
      # - key: ConnectionStrings__Default
      #   value: Data Source=/var/data/plum.db
    # disk:
    #   name: plum-data
    #   mountPath: /var/data
    #   sizeGB: 1
